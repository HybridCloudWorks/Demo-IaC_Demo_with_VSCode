name: "Curriculum L4 - Backup & Recovery Readiness"

# Manual only. Prerequisites: Levels 1-3 deployed with the same prefix.
#
# Read the L4.1 page before the first run. Vault redundancy and cross-region
# restore FREEZE the moment the first item is protected, so those two inputs
# are decisions, not defaults -- and L4.4 cannot undo them.
# See the Wiki -> Curriculum Level 4 - Protect.
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Instructor/testing override: deploy into this resource group instead of the fork-owner default"
        type: string
        required: false
        default: ""
      chapter:
        description: "Which chapter to deploy"
        type: choice
        required: true
        default: "L4.1 - Backup Fundamentals"
        options:
          - "L4.1 - Backup Fundamentals"
          - "L4.2 - PaaS Protection"
          - "L4.3 - Operational Backup Management"
          - "L4.4 - Enterprise Data Protection Strategy"
      include_web_tier:
        description: "L1.2 (firewall + web tier) is deployed - include it here"
        type: boolean
        required: true
        default: false
      secondary_region:
        description: "L1.4 (second region + DR SQL server) is deployed - include it here"
        type: boolean
        required: true
        default: false
      vault_redundancy:
        description: "Vault redundancy — FROZEN once anything is protected (L4.1 only)"
        type: choice
        required: true
        default: "GeoRedundant"
        options: ["GeoRedundant", "ZoneRedundant", "LocallyRedundant"]
      cross_region_restore:
        description: "Enable cross-region restore — needs GeoRedundant, cannot be added later"
        type: boolean
        required: true
        default: false
      dry_run:
        description: "Stop after what-if — show the changes, deploy nothing"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: curriculum-l4
  cancel-in-progress: false

env:
  # Deployment identity for the OIDC login. Each value comes from a
  # repository secret or variable of the same name (Setup-Oidc.ps1 sets
  # them as secrets; a classroom fork gets them as variables from its
  # row of the instructor's New-WorkshopEnvironment.ps1 output). Nothing
  # is hard-coded: the "Check Azure sign-in settings" step stops the run
  # if one is missing.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  # Classroom isolation is naming: each workshop GitHub account matches its
  # pre-created resource group, so the fork owner is the default target RG.
  # The AZURE_RESOURCE_GROUP secret still overrides it for self-hosted runs.
  AZURE_RESOURCE_GROUP: ${{ inputs.resource_group || secrets.AZURE_RESOURCE_GROUP || github.repository_owner }}
  CURRICULUM_INCLUDE_WEB_TIER: ${{ inputs.include_web_tier }}
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL || 'you@example.com' }}
  # Read by L4.1. Both freeze once the vault protects its first item, so they
  # are surfaced as run inputs rather than buried in the parameter file.
  CURRICULUM_SECONDARY_REGION: ${{ inputs.secondary_region }}
  CURRICULUM_VAULT_REDUNDANCY: ${{ inputs.vault_redundancy }}
  CURRICULUM_CROSS_REGION_RESTORE: ${{ inputs.cross_region_restore }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Fail fast with a clear message instead of an opaque login error.
      - name: Check Azure sign-in settings
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Azure sign-in is not configured::Missing:$missing. Add each one as a repository secret or variable (Settings > Secrets and variables > Actions), or run scripts/Setup-Oidc.ps1, which sets them for you."
            exit 1
          fi
          echo "Azure sign-in settings found (client, tenant and subscription IDs)."

      - uses: actions/checkout@v4

      # Without an AZURE_PREFIX repo variable, the prefix defaults to the fork
      # owner's name up to the first hyphen, lowercased and trimmed to the 12
      # chars the templates allow (student01-myevent -> student01). Classroom
      # forks get a unique AZURE_PREFIX from the instructor; set it to override.
      - name: Resolve resource group and prefix
        run: |
          if [ -z "$AZURE_PREFIX" ]; then
            owner='${{ github.repository_owner }}'
            prefix=$(printf '%s' "${owner%%-*}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-12)
            [ -n "$prefix" ] || prefix=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-12)
            echo "AZURE_PREFIX=$prefix" >> "$GITHUB_ENV"
            export AZURE_PREFIX="$prefix"
          fi
          echo "Prefix '$AZURE_PREFIX' -> resource group '$AZURE_RESOURCE_GROUP'"

      - name: Resolve chapter to a template path
        id: chapter
        env:
          CHAPTER: ${{ inputs.chapter }}
        run: |
          case "$CHAPTER" in
            "L4.1 - Backup Fundamentals") dir="curriculum/L4.1-backup-fundamentals" ;;
            "L4.2 - PaaS Protection") dir="curriculum/L4.2-paas-protection" ;;
            "L4.3 - Operational Backup Management") dir="curriculum/L4.3-backup-operations" ;;
            "L4.4 - Enterprise Data Protection Strategy") dir="curriculum/L4.4-data-protection-strategy" ;;
            *) echo "::error::Unknown chapter '$CHAPTER'"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$dir" | sed 's|curriculum/||; s|[^a-zA-Z0-9]|-|g')" >> "$GITHUB_OUTPUT"
          echo "Deploying $dir"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Lint (compile + linter)
        env:
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
        run: |
          az bicep build --file $CHAPTER_DIR/main.bicep --stdout > /dev/null
          az bicep build-params --file $CHAPTER_DIR/main.bicepparam --stdout > /dev/null

      - name: What-if (preview changes)
        env:
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
          CHAPTER_SLUG: ${{ steps.chapter.outputs.slug }}
        run: |
          az deployment group what-if \
            --name $CHAPTER_SLUG-whatif-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters $CHAPTER_DIR/main.bicepparam

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
          CHAPTER_SLUG: ${{ steps.chapter.outputs.slug }}
        run: |
          az deployment group create \
            --name $CHAPTER_SLUG-deploy-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters $CHAPTER_DIR/main.bicepparam

      # Redundancy is the one setting nobody can fix later, so surface what the
      # vault actually ended up with rather than what was requested.
      - name: Report vault redundancy and protected items
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          CHAPTER: ${{ inputs.chapter }}
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
        run: |
          {
            echo "## $CHAPTER"
            echo ""
            echo "Deployed from \`$CHAPTER_DIR\`."
            echo ""
            echo "### Vault state"
            echo ""
            echo "Redundancy freezes once the first item is protected. If this is not what"
            echo "you want, the vault has to be rebuilt — L4.4 cannot change it."
            echo ""
            echo '```'
            az backup vault backup-properties show -n "rsv-$AZURE_PREFIX-backup" -g $AZURE_RESOURCE_GROUP -o table 2>&1 || echo "Vault not deployed yet (expected before L4.1)."
            az backup item list --vault-name "rsv-$AZURE_PREFIX-backup" -g $AZURE_RESOURCE_GROUP --query "[].{item:properties.friendlyName,health:properties.healthStatus,lastBackup:properties.lastBackupStatus}" -o table 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Dry run - nothing was deployed
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run. The what-if above shows what a real run would change."
