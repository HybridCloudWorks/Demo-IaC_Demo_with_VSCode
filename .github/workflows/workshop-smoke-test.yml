name: "Workshop smoke test (instructor)"

# Instructor-only verification of the L1.1 deploy. Logs in with the identity
# named by this repo's AZURE_* secrets or variables -- read the same way the
# student workflows read them -- and runs the L1.1 stages (lint -> what-if ->
# deploy) against a chosen testing resource group. This is exactly what a
# student fork does, minus the fork.
#
# NOTE: this run's OIDC subject is this repo and branch, so that identity
# needs a federated credential for exactly that subject, plus Contributor on
# the testing group. The simpler end-to-end check of the classroom path: put
# your own GitHub account in the roster, fork, and run L1.1 from your fork
# like a student (docs/wiki/Instructor-Environment-Setup.md). A login failure
# here names the exact subject GitHub sent.
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Testing resource group (one the identity holds Contributor on)"
        type: string
        required: true
        default: "student01"
      prefix:
        description: "Resource prefix (lowercase, max 12 chars)"
        type: string
        required: true
        default: "student01"
      deploy:
        description: "Deploy after what-if (uncheck for what-if only)"
        type: boolean
        required: true
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: workshop-smoke-test
  cancel-in-progress: false

env:
  # The identity to test with. Nothing is hard-coded: set these as
  # repository secrets or variables on this repo. The "Check Azure sign-in
  # settings" step stops the run if one is missing.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_PREFIX: ${{ inputs.prefix }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZURE_RESOURCE_GROUP: ${{ inputs.resource_group }}
  # Same rule as the student workflows: the VM_ADMIN_PASSWORD secret if set,
  # otherwise a random password generated for this run only.
  VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      # Fail fast with a clear message instead of an opaque login error.
      - name: Check Azure sign-in settings
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Azure sign-in is not configured::Missing:$missing. Add each one as a repository secret or variable (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Azure sign-in settings found (client, tenant and subscription IDs)."

      # No secret set: generate a password for this run only. 24 random
      # letters and digits plus 'Aa1!' meets Azure's VM rules (length and
      # 3 of 4 character classes). It is masked before anything can print it.
      - name: Resolve admin password
        run: |
          if [ -z "$VM_ADMIN_PASSWORD" ]; then
            pw="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-24)Aa1!"
            echo "::add-mask::$pw"
            echo "VM_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "No VM_ADMIN_PASSWORD secret: generated a one-time password for this run (masked)."
          fi

      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the testing resource group is reachable
        run: az group show --name "$AZURE_RESOURCE_GROUP" --query "{name:name, location:location}" -o table

      - name: Lint (compile + linter)
        run: |
          az bicep build --file curriculum/L1.1-core-deployment/main.bicep --stdout > /dev/null
          az bicep build-params --file curriculum/L1.1-core-deployment/main.bicepparam --stdout > /dev/null

      - name: What-if (preview changes)
        run: |
          az deployment group what-if \
            --name smoke-whatif-${{ github.run_number }} \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters curriculum/L1.1-core-deployment/main.bicepparam

      - name: Deploy
        if: ${{ inputs.deploy }}
        run: |
          az deployment group create \
            --name smoke-deploy-${{ github.run_number }} \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters curriculum/L1.1-core-deployment/main.bicepparam
